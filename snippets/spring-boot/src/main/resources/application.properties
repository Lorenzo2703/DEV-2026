spring.application.name=spring-boot-snippet
server.address=127.0.0.1
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
spring.lifecycle.timeout-per-shutdown-phase=20s
