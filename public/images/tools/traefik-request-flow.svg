<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Traefik request and configuration flow</title>
  <desc id="desc">Internet traffic reaches Traefik over HTTPS. Routers and middleware select frontend or API services. Docker, Kubernetes, or file providers supply route configuration to Traefik.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101923"/>
      <stop offset="1" stop-color="#173642"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9de3ef" stroke-opacity=".08"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9de3ef"/>
    </marker>
    <marker id="config-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f3c878"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#background)"/>
  <rect width="1200" height="560" rx="24" fill="url(#grid)"/>
  <g fill="none" stroke="#9de3ef" stroke-width="4" marker-end="url(#arrow)">
    <path d="M270 290H385"/>
    <path d="M735 250H830V190H895"/>
    <path d="M735 310H830V380H895"/>
  </g>
  <path d="M555 154V119" fill="none" stroke="#f3c878" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#config-arrow)"/>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <g>
      <rect x="60" y="220" width="210" height="140" rx="14" fill="#18212f" stroke="#9de3ef" stroke-width="2"/>
      <circle cx="165" cy="267" r="25" fill="none" stroke="#9de3ef" stroke-width="3"/>
      <path d="M140 267H190M165 242C154 255 154 279 165 292M165 242C176 255 176 279 165 292M145 251H185M145 283H185" fill="none" stroke="#9de3ef" stroke-width="2"/>
      <text x="165" y="328" fill="#f2f6fa" font-size="21">Internet</text>
    </g>
    <g>
      <rect x="385" y="154" width="350" height="252" rx="18" fill="#18212f" stroke="#9de3ef" stroke-width="3"/>
      <text x="560" y="207" fill="#9de3ef" font-size="30" font-weight="700">Traefik</text>
      <rect x="420" y="232" width="280" height="58" rx="8" fill="#173642" stroke="#9de3ef"/>
      <text x="560" y="269" fill="#f2f6fa" font-size="20">Entry point · HTTPS</text>
      <rect x="420" y="310" width="280" height="62" rx="8" fill="#173642" stroke="#9de3ef"/>
      <text x="560" y="337" fill="#f2f6fa" font-size="17">Router → middleware</text>
      <text x="560" y="360" fill="#bbc8d5" font-size="15">matches request, applies policy</text>
    </g>
    <g>
      <rect x="390" y="42" width="330" height="77" rx="12" fill="#18212f" stroke="#f3c878" stroke-width="2"/>
      <text x="555" y="74" fill="#f3c878" font-size="18" font-weight="700">Configuration providers</text>
      <text x="555" y="99" fill="#f2f6fa" font-size="16">Docker · Kubernetes · files</text>
    </g>
    <g>
      <rect x="895" y="145" width="245" height="94" rx="12" fill="#18212f" stroke="#9de3ef" stroke-width="2"/>
      <circle cx="924" cy="192" r="7" fill="#9de3ef"/>
      <text x="1020" y="187" fill="#f2f6fa" font-size="20" font-weight="700">Frontend</text>
      <text x="1020" y="215" fill="#bbc8d5" font-size="15">app.example.test</text>
      <rect x="895" y="333" width="245" height="94" rx="12" fill="#18212f" stroke="#9de3ef" stroke-width="2"/>
      <circle cx="924" cy="380" r="7" fill="#9de3ef"/>
      <text x="1020" y="375" fill="#f2f6fa" font-size="20" font-weight="700">API service</text>
      <text x="1020" y="403" fill="#bbc8d5" font-size="15">app.example.test/api</text>
    </g>
    <text x="165" y="405" fill="#bbc8d5" font-size="16">HTTPS request</text>
    <text x="560" y="463" fill="#bbc8d5" font-size="16">Routes change as provider configuration changes</text>
    <text x="1015" y="486" fill="#9de3ef" font-size="16">Private upstreams</text>
  </g>
</svg>
