name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint does not yet support $/ syntax
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      UMAMI_SCRIPT_PATH: ${{ vars.UMAMI_SCRIPT_PATH }}
      UMAMI_HOST_URL: ${{ vars.UMAMI_HOST_URL }}
      UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
    steps:
      - name: Require production site URL
        run: test -n "$SITE_URL" || { echo "Set the production SITE_URL environment variable." >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun ci
      - run: bun run build
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
